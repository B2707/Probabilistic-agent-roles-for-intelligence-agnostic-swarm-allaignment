# Production run (v3, docs/specs/2026-11-07-swarm-v3.md): arm A100-mix. One swarm of 100 on all 55 problems, global PR
# review, swarm-wide score, aggressive instigator, turn order shuffled each round. Uninformed, no investigators, k = 0, p = 0.
# Mixed swarm on Adaption credits (docs/specs/2026-11-07-swarm-v3.md, "8 Nov: Adaption models"): half the agents
# run deepseek-v4-flash (high), half qwen3.8-27b (xhigh, it refuses high). Auditor and judge run on glm-53-flash,
# a model outside the swarm, as terra is for luna. Everything else matches A100-6-luna.
name = "A100-mix"
swarm_size = 100
rounds = 20
seed = 1
initial_investigators = 0
k = 0.0
p = 0.0
informed = false
pressure = true
instigator = true
instigator_aggressive = true
swarm_wide = true
pr_approvals = 2
honest_exit = false
turn_tool_budget = 10
tests_visible = true
turn_timeout_s = 180
problems_file = "data/problems_oneoff.json"
problems = 55
worker_model = "adaption/deepseek-v4-flash"  # unused: every agent takes its model from worker_mix
worker_mix = { "adaption/deepseek-v4-flash" = "high", "adaption/qwen3.8-27b" = "xhigh" }
auditor_model = "adaption/glm-53-flash"
auditor_reasoning_effort = "max"
judge_model = "adaption/glm-53-flash"
judge_reasoning_effort = "max"
reasoning_effort = "high"
concurrency = 25
shuffle_turns = true
