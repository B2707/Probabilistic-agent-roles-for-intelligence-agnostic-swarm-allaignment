# Production run (v3, docs/specs/2026-11-07-swarm-v3.md): arm B100-dsv4flash. One swarm of 100 on all 55 problems, global PR
# review, swarm-wide score, aggressive instigator, turn order shuffled each round. Uninformed, 10 investigators at start, k = 0.02, p = 0.01.
# Worker model deepseek-v4-flash on Adaption credits (docs/specs/2026-11-07-swarm-v3.md, "8 Nov: Adaption models");
# auditor and judge stay on gpt-6.1-terra, as in B100-6-luna.
name = "B100-dsv4flash"
swarm_size = 100
rounds = 20
seed = 1
initial_investigators = 10
k = 0.02
p = 0.01
informed = false
pressure = true
instigator = true
instigator_aggressive = true
swarm_wide = true
pr_approvals = 2
honest_exit = false
turn_tool_budget = 10
tests_visible = true
turn_timeout_s = 180
problems_file = "data/problems_oneoff.json"
problems = 55
worker_model = "adaption/deepseek-v4-flash"
worker_reasoning_effort = "high"
auditor_model = "gpt-6.1-terra"
auditor_reasoning_effort = "max"
judge_model = "gpt-6.1-terra"
judge_reasoning_effort = "max"
reasoning_effort = "high"
concurrency = 25
shuffle_turns = true
