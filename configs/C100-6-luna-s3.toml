# Seed 3 of C100-6-luna (Bader, 8 Nov 03:30: more runs per arm to measure how much is luck). Same name, so metrics average the seeds. Fast mode. Production run (v3, docs/specs/2026-11-07-swarm-v3.md): arm C100-6-luna. One swarm of 100 on all 55 problems, global PR
# review, swarm-wide score, aggressive instigator, turn order shuffled each round. Informed, 10 investigators at start, k = 0.02, p = 0.01.
name = "C100-6-luna"
swarm_size = 100
rounds = 20
seed = 3
initial_investigators = 10
k = 0.02
p = 0.01
informed = true
pressure = true
