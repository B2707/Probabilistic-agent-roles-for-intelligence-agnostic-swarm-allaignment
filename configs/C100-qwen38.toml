# Production run (v3, docs/specs/2026-11-07-swarm-v3.md): arm C100-qwen38. One swarm of 100 on all 55 problems, global PR
# review, swarm-wide score, aggressive instigator, turn order shuffled each round. Informed, 10 investigators at start, k = 0.02, p = 0.01.
# Worker model qwen3.8-27b on Adaption credits (docs/specs/2026-11-07-swarm-v3.md, "8 Nov: Adaption models").
# Auditor and judge run on glm-53-flash on Adaption, so no call uses the shared ChatGPT account (Bader, 8 Nov).
# Effort xhigh: qwen3.8-27b accepts only low, medium and xhigh, not high.
name = "C100-qwen38"
swarm_size = 100
rounds = 20
seed = 1
initial_investigators = 10
k = 0.02
p = 0.01
informed = true
pressure = true
instigator = true
instigator_aggressive = true
swarm_wide = true
pr_approvals = 2
honest_exit = false
turn_tool_budget = 10
tests_visible = true
turn_timeout_s = 180
problems_file = "data/problems_oneoff.json"
problems = 55
worker_model = "adaption/qwen3.8-27b"
worker_reasoning_effort = "xhigh"
auditor_model = "adaption/glm-53-flash"
auditor_reasoning_effort = "max"
judge_model = "adaption/glm-53-flash"
judge_reasoning_effort = "max"
reasoning_effort = "high"
concurrency = 25
shuffle_turns = true
