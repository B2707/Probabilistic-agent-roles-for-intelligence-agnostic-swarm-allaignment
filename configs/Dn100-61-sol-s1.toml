judge_model = "gpt-6.1-terra"
judge_reasoning_effort = "max"
reasoning_effort = "high"
concurrency = 25
shuffle_turns = true
final_audit = false
service_tier = "priority"  # Codex Fast mode on every call
swarm_home = ".swarm-home-2"
