# F100-6-luna-s3 on a second ChatGPT account (the remaining luna runs use it, 2 at once; sol stays on the first account).
# Identical to configs/F100-6-luna-s3.toml except swarm_home. The -mo suffix only
# separates the run folders so the queues can count runs per account.
# Seed 3 of F100-6-luna (3 seeds per arm, the same seeds 1 to 3 as A/B/C). Same name, so metrics average the seeds.
# Arm F, baseline: 100 agents and the task, nothing else. Uninformed, no investigators (I0 = 0, k = 0),
# no random audits (p = 0), no instigator. Same as A100-6-luna seed 1 except the instigator and the final audit are off. Workers on gpt-6-luna (high).
# No terra pass at all, not even the end-of-run audit (F is plain; Opus labels are its only grading). Fast mode, like the A/B/C seeds. Opus xhigh labels.
name = "F100-6-luna"
swarm_size = 100
rounds = 20
seed = 3
initial_investigators = 0
k = 0.0
p = 0.0
informed = false
pressure = true
instigator = false
instigator_aggressive = false
swarm_wide = true
pr_approvals = 2
honest_exit = false
turn_tool_budget = 10
tests_visible = true
turn_timeout_s = 180
problems_file = "data/problems_oneoff.json"
problems = 55
worker_model = "gpt-6-luna"
worker_reasoning_effort = "high"
auditor_model = "gpt-6.1-terra"
auditor_reasoning_effort = "max"
judge_model = "gpt-6.1-terra"
judge_reasoning_effort = "max"
reasoning_effort = "high"
concurrency = 25
shuffle_turns = true
final_audit = false
service_tier = "priority"  # Codex Fast mode on every call (without it 15 of 100 luna round-1 turns timed out)
swarm_home = ".swarm-home-mohammad"
