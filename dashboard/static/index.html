<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Swarm oversight results</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/static/style.css">
<script>
  try { const t = localStorage.getItem("swarm-theme"); if (t) document.documentElement.dataset.theme = t;
        else if (matchMedia("(prefers-color-scheme: light)").matches) document.documentElement.dataset.theme = "light"; } catch (e) {}
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.5.0/echarts.min.js" defer></script>
</head>
<body>
<header class="top">
  <a class="brand" href="#/"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 3 7v10l9 5 9-5V7l-9-5Zm0 2.3 6.9 3.8L12 12 5.1 8.1 12 4.3ZM5 9.8l6 3.4v6.6l-6-3.3V9.8Zm8 10V13.2l6-3.4v6.7l-6 3.3Z"/></svg><span>Swarm oversight results</span></a>
  <nav class="tabs" id="nav">
    <a href="#/results" data-nav="results">Results</a>
    <a href="#/overview" data-nav="overview">All runs</a>
    <a href="#/run" data-nav="run" id="nav-run">Run details</a>
    <a href="#/ops" data-nav="ops" hidden>Operations</a>
  </nav>
  <div class="top-right">
    <div id="machines" class="machines"></div>
    <div id="live" class="live" title="Live stream status" hidden><i></i><span>connecting</span></div>
    <button id="notify" class="icon-btn" hidden title="Browser notifications for cheats, removals and run state changes" aria-label="Notifications">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3a1.5 1.5 0 0 0-3 0v1.16A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg>
    </button>
    <button id="theme" class="icon-btn" title="Toggle dark / light" aria-label="Toggle theme">
      <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.39 5.39 0 0 1-4.4 2.26 5.4 5.4 0 0 1-3.14-9.8A9.3 9.3 0 0 0 12 3Z"/></svg>
    </button>
  </div>
</header>
<div id="banner" class="banner" hidden></div>
<main id="view"><div class="loading">Loading runs…</div></main>
<aside id="drawer" class="drawer" hidden>
  <div class="drawer-head"><div id="drawer-title"></div><button class="icon-btn" id="drawer-close" aria-label="Close">✕</button></div>
  <div id="drawer-body" class="drawer-body"></div>
</aside>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/static/app.js" defer></script>
</body>
</html>
