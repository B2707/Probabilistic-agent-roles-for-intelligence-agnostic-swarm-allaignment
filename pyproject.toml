[project]
name = "swarm"
version = "0.1.0"
description = "Agent swarm experiment harness: hidden investigator conversion vs collusion"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.9",
    "uvicorn>=0.30",
    "starlette>=0.37",
    "httpx>=0.27",
    "pytest>=8",
]

[project.scripts]
swarm = "swarm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
